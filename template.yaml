AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ML Usage Tracker Lambda with API Gateway POST endpoint

Parameters:
  DynamoDBTable:
    Type: String
    Description: Name of the DynamoDB table for storing reports
  APIKey:
    Type: String  
    Description: Static API Key for authentication
  SocialLensTableName:
    Type: String
    Description: Name of the existing Social_Lens DynamoDB table
    Default: Social_Lens
  SocialLensTableArn:
    Type: String
    Description: ARN of the existing Social_Lens DynamoDB table
    Default: arn:aws:dynamodb:ap-south-1:069717477936:table/Social_Lens

Resources:
  MLUsageTrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-usage-tracker
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      CodeUri: .
      MemorySize: 256
      Timeout: 60  # Increased timeout for scanning large DynamoDB table
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref DynamoDBTable
          SOCIAL_LENS_TABLE: !Ref SocialLensTableName
          STATIC_API_KEY: !Ref APIKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
              Resource: !Ref SocialLensTableArn
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ce:GetCostAndUsage
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /track
            Method: post

Outputs:
  LambdaFunctionName:
    Description: Name of the Lambda function
    Value: !Ref MLUsageTrackerFunction

  TrackAPIEndpoint:
    Description: URL for POST /track
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/track"

  DynamoDBTableName:
    Description: DynamoDB table for storing reports
    Value: !Ref DynamoDBTable

  SocialLensTableName:
    Description: Social_Lens DynamoDB table for Perplexity cost analysis
    Value: !Ref SocialLensTableName